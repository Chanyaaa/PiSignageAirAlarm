services:
  airalarm:
    build: .
    container_name: pisignage-airalarm
    restart: unless-stopped
    extra_hosts:                # host.docker.internal = the Docker host, also on Linux
      - host.docker.internal:host-gateway
    env_file: .env
    environment:
      - TZ=Europe/Kiev
    volumes:
      - ./data:/data            # state.json: groups' playlists saved during an alarm
